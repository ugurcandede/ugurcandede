  </style>

  <text x="2" y="28" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="18" font-weight="700">
    <tspan class="accent-green">$</tspan> <tspan class="text-primary">ls</tspan> <tspan class="accent-cyan">~/projects</tspan>
  </text>
  <line class="border" x1="200" y1="22" x2="1038" y2="22" stroke-width="1.4"/>
